<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1280" viewBox="0 0 1240 1280" role="img" aria-labelledby="title description">
  <title id="title">Four software flows, one maintenance change</title>
  <desc id="description">Saturday preparation collects APT, Docker, manual software and pip facts. Short serial AI assessments lead to one prepared change. Sunday preflight either fails without application changes or admits one executor. Actions run APT, Docker, manual, pip in sequence with verification. One terminal transaction produces the record, receipts and audit outbox, then Splunk indexes events.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526477"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #192f43; }
      .title { font-size: 28px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 700; }
      .label { font-size: 16px; }
      .small { font-size: 14px; fill: #455b70; }
      .node { fill: #ffffff; stroke: #98aec2; stroke-width: 1.5; rx: 10; }
      .flow { fill: #e8f2fb; stroke: #4681b4; stroke-width: 1.5; rx: 10; }
      .control { fill: #e6f5ef; stroke: #418369; stroke-width: 1.5; rx: 10; }
      .failure { fill: #fff0ed; stroke: #be6554; stroke-width: 1.5; rx: 10; }
      .edge { fill: none; stroke: #526477; stroke-width: 2; marker-end: url(#arrow); }
      .line { fill: none; stroke: #526477; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1240" height="1280" fill="#f5f8fb"/>
  <text x="620" y="42" text-anchor="middle" class="title">Four software flows. One maintenance change.</text>
  <text x="620" y="68" text-anchor="middle" class="small">Final weekly schedule · Europe/Copenhagen · deterministic control, bounded AI</text>

  <rect x="320" y="88" width="600" height="52" class="node"/>
  <text x="620" y="120" text-anchor="middle" class="heading">Saturday 20:00 — preparation timer</text>
  <path d="M620 140 V158" class="edge"/>
  <rect x="320" y="160" width="600" height="52" class="control"/>
  <text x="620" y="192" text-anchor="middle" class="label">Lock → reconcile bookkeeping → collect required host health</text>
  <path d="M620 212 V226 M175 226 H1060" class="line"/>
  <path d="M175 226 V240 M470 226 V240 M765 226 V240 M1060 226 V240" class="edge"/>

  <rect x="40" y="242" width="270" height="116" class="flow"/>
  <text x="175" y="273" text-anchor="middle" class="heading">APT</text>
  <text x="175" y="300" text-anchor="middle" class="label">Installed packages + simulation</text>
  <text x="175" y="325" text-anchor="middle" class="small">Bounded transaction policy</text>
  <text x="175" y="346" text-anchor="middle" class="small">Exact versions after refresh</text>
  <rect x="335" y="242" width="270" height="116" class="flow"/>
  <text x="470" y="273" text-anchor="middle" class="heading">Docker / Compose</text>
  <text x="470" y="300" text-anchor="middle" class="label">Registered services only</text>
  <text x="470" y="325" text-anchor="middle" class="small">Pinned image + policy + mounts</text>
  <text x="470" y="346" text-anchor="middle" class="small">Backup before replacement</text>
  <rect x="630" y="242" width="270" height="116" class="flow"/>
  <text x="765" y="273" text-anchor="middle" class="heading">Manual software</text>
  <text x="765" y="300" text-anchor="middle" class="label">Registered vendor releases</text>
  <text x="765" y="325" text-anchor="middle" class="small">Verified exact artifact</text>
  <text x="765" y="346" text-anchor="middle" class="small">Other products: report + defer</text>
  <rect x="925" y="242" width="270" height="116" class="flow"/>
  <text x="1060" y="273" text-anchor="middle" class="heading">Python pip</text>
  <text x="1060" y="300" text-anchor="middle" class="label">Registered application venvs</text>
  <text x="1060" y="325" text-anchor="middle" class="small">Exact hashed wheel manifest</text>
  <text x="1060" y="346" text-anchor="middle" class="small">System Python remains excluded</text>
  <path d="M175 358 V380 H1060 V358 M470 358 V380 M765 358 V380" class="line"/>
  <path d="M620 380 V405" class="edge"/>

  <rect x="260" y="408" width="720" height="68" class="node"/>
  <text x="620" y="436" text-anchor="middle" class="heading">Deterministic policy → short AI assessment per selected flow</text>
  <text x="620" y="460" text-anchor="middle" class="small">One call at a time · maximum four calls · no commands · failures block preparation</text>
  <path d="M620 476 V504" class="edge"/>
  <rect x="320" y="507" width="600" height="68" class="control"/>
  <text x="620" y="535" text-anchor="middle" class="heading">One immutable plan + one PREPARED change</text>
  <text x="620" y="559" text-anchor="middle" class="small">Selected actions + evidence + deferrals; blocked plans cannot execute</text>
  <path d="M620 575 V617" class="edge"/>
  <text x="640" y="600" class="small">Next day</text>

  <rect x="320" y="620" width="600" height="68" class="node"/>
  <text x="620" y="649" text-anchor="middle" class="heading">Sunday 20:00 — lock + preflight</text>
  <text x="620" y="673" text-anchor="middle" class="small">Check identity, window, age, policy, health and drift</text>
  <path d="M920 653 H1060 V704" class="edge"/>
  <text x="974" y="642" class="small">Gate fails</text>
  <rect x="932" y="708" width="260" height="82" class="failure"/>
  <text x="1062" y="736" text-anchor="middle" class="heading">FAILED</text>
  <text x="1062" y="760" text-anchor="middle" class="small">No package/application changes</text>
  <text x="1062" y="779" text-anchor="middle" class="small">Record reason and closure</text>
  <path d="M620 688 V730" class="edge"/>
  <text x="640" y="714" class="small">Gates pass</text>

  <rect x="260" y="734" width="640" height="78" class="control"/>
  <text x="580" y="763" text-anchor="middle" class="heading">Commit RUNNING → one executor</text>
  <text x="580" y="791" text-anchor="middle" class="label">APT → Docker → manual software → pip</text>
  <path d="M580 812 V842" class="edge"/>
  <rect x="260" y="846" width="640" height="70" class="node"/>
  <text x="580" y="874" text-anchor="middle" class="heading">Verify each action; then verify the whole host</text>
  <text x="580" y="898" text-anchor="middle" class="small">Failure stops later mutations · interruption stays RUNNING for operator review</text>
  <path d="M580 916 V945" class="edge"/>
  <rect x="260" y="949" width="640" height="66" class="control"/>
  <text x="580" y="977" text-anchor="middle" class="heading">One terminal transaction: CLOSED or FAILED</text>
  <text x="580" y="1001" text-anchor="middle" class="small">Record + verified flow outcomes + completion receipt + event outbox</text>
  <path d="M1062 790 V1040 H620 V1060 M580 1015 V1040 H620" class="line"/>
  <path d="M620 1040 V1060" class="edge"/>
  <rect x="320" y="1064" width="600" height="56" class="node"/>
  <text x="620" y="1098" text-anchor="middle" class="label">Durable text/JSON records + JSONL events with stable event IDs</text>
  <path d="M620 1120 V1150" class="edge"/>
  <rect x="320" y="1154" width="600" height="56" class="node"/>
  <text x="620" y="1188" text-anchor="middle" class="label">Splunk file monitor → dashboards → verify search visibility</text>
  <text x="620" y="1241" text-anchor="middle" class="small">Branches represent separate responsibilities; host mutations are always serial.</text>
  <text x="620" y="1262" text-anchor="middle" class="small">Cutover first preserves legacy cadence. The weekly schedule is activated in a separate migration stage.</text>
</svg>
