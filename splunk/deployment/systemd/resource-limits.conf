[Unit]
After=
After=network.target
Wants=

[Service]
CPUAccounting=true
CPUQuota=200%
CPUWeight=50
MemoryAccounting=true
MemoryHigh=5G
MemoryMax=6G
MemorySwapMax=512M
IOAccounting=true
IOWeight=50
Nice=5
LimitNOFILE=65536
LimitNPROC=16000
TasksMax=4096
LimitCORE=0
NoNewPrivileges=true
UMask=0027
RestartSec=15s
ExecStart=
ExecStart=/usr/bin/python3 /opt/splunk/etc/system/local/splunk-launch-no-thp.py
ExecStartPost=
Delegate=false
