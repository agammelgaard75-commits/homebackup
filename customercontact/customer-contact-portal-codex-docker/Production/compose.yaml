# One portable stack: HTTPS entry point, Django app, PostgreSQL database.
# App and database have no published ports; persistent state uses named volumes.
name: customer-contact-portal

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    logging: *logging
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    cpus: ${DB_CPU_LIMIT:-1.0}
    pids_limit: 200
    # Avoid SQL statements/constraint values appearing in database error logs.
    command: ["postgres", "-c", "log_min_error_statement=panic", "-c", "log_error_verbosity=terse", "-c", "log_parameter_max_length_on_error=0"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        GIT_REVISION: ${GIT_REVISION:-unknown}
    image: ${APP_IMAGE:-${COMPOSE_PROJECT_NAME:-customer-contact-portal}-app:local}
    logging: *logging
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    cpus: ${APP_CPU_LIMIT:-2.0}
    pids_limit: 128
    restart: unless-stopped
    env_file:
      - ${PORTAL_ENV_FILE:-.env}
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      PORTAL_ENV: development
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - application
      - database
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # HTTPS redirect remains enabled in Django: tell Django the proxy used HTTPS.
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=4).read()"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s

  proxy:
    build:
      context: ./deploy/caddy
      dockerfile: Dockerfile
    image: ${PROXY_IMAGE:-${COMPOSE_PROJECT_NAME:-customer-contact-portal}-proxy:2.11.7-portal.1}
    logging: *logging
    mem_limit: ${PROXY_MEMORY_LIMIT:-256m}
    cpus: ${PROXY_CPU_LIMIT:-0.5}
    pids_limit: 128
    restart: unless-stopped
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?Set PORTAL_DOMAIN in .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "${PORT_BIND_IP:-0.0.0.0}:80:80"
      - "${PORT_BIND_IP:-0.0.0.0}:443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge
      - application
    security_opt:
      - no-new-privileges:true

networks:
  edge: {}
  application:
    internal: true
  database:
    internal: true

volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
