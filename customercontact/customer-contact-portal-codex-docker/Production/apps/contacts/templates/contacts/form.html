{% extends 'base.html' %}
{% block title %}{{ title }} · Customer Portal{% endblock %}
{% block content %}
<a class="back-link" href="{{ back_url }}">← Back</a>
<div class="page-intro">{% if customer %}<p class="eyebrow"><a href="{{ customer.get_absolute_url }}">{{ customer.name }}</a></p>{% endif %}<h1>{{ title }}</h1><p>{{ form_help }}</p></div>
<form class="panel customer-form" method="post">{% csrf_token %}
{% include 'contacts/_fields.html' %}
<div class="actions"><button type="submit">{{ submit_label }}</button><a href="{{ back_url }}">Cancel</a></div>
</form>
{% endblock %}
