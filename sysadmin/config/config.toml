[schedule]
frequency = "daily" # Maintenance 20:00, preparation 23:00 Europe/Copenhagen

[policy]
minimum_free_root_percent = 15
maximum_failed_units = 0
package_update_timeout_seconds = 1800
allow_service_restart = true

[paths]
state_dir = "/var/lib/ai-sysadmin"
log_dir = "/var/log/ai-sysadmin"
ignore_file = "/etc/ai-sysadmin/IGNORE.md"

[inventory]
# Read-only discovery in immediate installation directories under these roots.
# APT, configured Splunk home, and installed Snap/system Flatpak are also checked.
roots = ["/opt", "/usr/local"]

[containers]
# Inventory and automatic updates are opt-in per deployment/service.
enabled = false
# Example policy (enable containers above and uncomment to manage this service):
# [[containers.services]]
# name = "n8n"
# project = "n8n"
# service = "n8n"
# compose_files = ["/home/bot/n8n/docker-compose.yml"]
# image = "docker.n8n.io/n8nio/n8n:latest"
# hold = false
# health_url = "http://127.0.0.1:5678/healthz/readiness"
# health_timeout_seconds = 180
# maximum_backup_bytes = 1073741824

[ai]
# Trusted local adapter: reads inspection JSON on stdin, returns JSON containing
# proceed (boolean) and reasoning (string). Must not execute maintenance itself.
required = true
command = ["/usr/bin/python3", "/opt/ai-sysadmin/bin/litellm-planner.py"]
model = "qwen3.5:9b"
base_url = "http://127.0.0.1:4000/v1"
api_key_file = "/etc/ai-sysadmin/litellm.key"
# The gateway model has a 600-second timeout; allow its response to complete.
timeout_seconds = 660

[splunk]
# Set to the Splunk Enterprise or Universal Forwarder installation directory.
home = "/opt/splunk"
# Install the AI Sysadmin Splunk app alongside the controller.
install_app = true
