{% if page_obj.has_other_pages %}<nav class="pagination" aria-label="{{ pagination_label|default:'Result pages' }}">
{% if page_obj.has_previous %}<a rel="prev" href="?{{ filter_query }}&amp;{{ page_key|default:'page' }}={{ page_obj.previous_page_number }}">Previous</a>{% endif %}
<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
{% if page_obj.has_next %}<a rel="next" href="?{{ filter_query }}&amp;{{ page_key|default:'page' }}={{ page_obj.next_page_number }}">Next</a>{% endif %}
</nav>{% endif %}
