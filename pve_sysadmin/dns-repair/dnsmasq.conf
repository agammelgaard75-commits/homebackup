# Sandbox DNS only. DHCP remains on the existing network router.
port=53
interface=lo
interface=eth0
bind-dynamic
no-resolv
no-hosts
server=1.1.1.1
server=8.8.8.8
domain-needed
bogus-priv
local=/home.lab/
local=/2.168.192.in-addr.arpa/
local-ttl=60
cache-size=1000
host-record=dns01.home.lab,dns01,192.168.2.127
host-record=splunk-cm.home.lab,splunk-cm,192.168.2.169
host-record=splunk-idx1.home.lab,splunk-idx1,192.168.2.171
host-record=splunk-idx2.home.lab,splunk-idx2,192.168.2.173
host-record=splunk-sh.home.lab,splunk-sh,192.168.2.175
host-record=sandboxpve.home.lab,sandboxpve,10.10.1.10
