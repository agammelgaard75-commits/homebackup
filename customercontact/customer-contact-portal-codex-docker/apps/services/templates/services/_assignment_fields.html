{% if form.errors %}<div class="form-errors" role="alert">Please correct the errors below. {{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}<div class="field">{{ field.label_tag }}{{ field }}{% if field.help_text %}<p class="help-text">{{ field.help_text }}</p>{% endif %}{{ field.errors }}</div>{% endfor %}
