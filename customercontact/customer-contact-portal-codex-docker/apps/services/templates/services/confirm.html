{% extends 'base.html' %}
{% block title %}{{ title }} · Customer Portal{% endblock %}
{% block content %}
<a class="back-link" href="{{ back_url }}">← Back</a>
<section class="panel">{% if customer %}<p><a href="{{ customer.get_absolute_url }}">{{ customer.name }}</a></p>{% endif %}<h1>{{ title }}</h1><h2>{{ subject }}</h2><p>{{ explanation }}</p>
<form method="post">{% csrf_token %}<div class="actions"><button type="submit">{{ title }}</button><a href="{{ back_url }}">Cancel</a></div></form></section>
{% endblock %}
