services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: always

    ports:
      - "5678:5678"

    env_file:
      - .env.recovered

    environment:
      N8N_RESTRICT_FILE_ACCESS_TO: /files/logs
      GENERIC_TIMEZONE: Europe/Copenhagen
      NODES_EXCLUDE: "[]"

    volumes:
      - n8n_data:/home/node/.n8n
      - /home/bot/n8n-stock-agent/logs:/files/logs
      - /home/bot/n8n-task-breaker:/data/task-breaker

    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
    external: true
    name: n8n_n8n_data
